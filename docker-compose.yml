services:
  postgres:
    image: postgres:16-alpine
    container_name: solana-arbitrage-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-arbitrage}
      POSTGRES_USER: ${DATABASE_USER:-arbitrage_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-arbitrage_secure_password_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arbitrage-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-arbitrage_user} -d ${DATABASE_NAME:-arbitrage}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: solana-arbitrage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password_dev}"]
    volumes:
      - redis_data:/data
    networks:
      - arbitrage-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_dev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  arbitrage-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
